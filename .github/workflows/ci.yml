# GENERATED by export-public.sh. Actions are pinned by commit; the tag is in the comment.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      leanchecker:
        description: "Also replay the environment in the kernel with leanchecker (slow)"
        type: boolean
        default: false

jobs:
  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # lean-action v1.6.2: installs elan, runs `lake exe cache get` (mathlib cache) and `lake build`,
      # then audits every declaration under the namespace `RationalQuivers` with
      # leanprover-community/axiom-audit (v0.1.2, pinned by the action) against the allowlist
      # propext, Classical.choice, Quot.sound.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: lean
          use-mathlib-cache: "true"
          axiom-audit: "true"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
          axiom-audit-root: RationalQuivers

      # Every labelled statement of the manuscript that has a Lean claimant
      # (correspondence/LABEL-DECL.tsv): the claimant exists and uses only the three standard axioms.
      - name: Check the claimed declarations
        working-directory: lean
        run: lake build Check

  leanchecker:
    name: Kernel replay (leanchecker)
    if: github.event_name == 'workflow_dispatch' && inputs.leanchecker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: lean
          use-mathlib-cache: "true"
          leanchecker: "true"
          leanchecker-args: "RationalQuivers"

  paper:
    name: Manuscript PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          working_directory: latex
          root_file: rational_quivers.tex
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rational_quivers-pdf
          path: latex/rational_quivers.pdf
