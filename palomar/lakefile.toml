# Palomar Comparator project for the Lean formalization of
#   F. Januszewski, "Rational structures on quivers and a generalization of Gelfand's equivalence".
# A Lake project of its own in palomar/ of drjanosch42/rational_quivers; the formalization is the
# Lean package in ../lean, required here by path.
name = "rationalQuiversPalomar"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]

# Mathlib: canonical repository at the v4.35.0 release (its lean-toolchain is v4.35.0, which must
# equal ./lean-toolchain exactly).  Tag v4.35.0 = 56a005855ea17e0b0958f73ec801ae140b0a1679, the
# same revision that ../lean/lakefile.toml and ../lean/lake-manifest.json pin.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# The formalization (used by the Solution only): the Lean package `lean/` of this repository, a
# contained path dependency within the same checkout.
[[require]]
name = "rationalQuivers"
path = "../lean"

# The trusted statement surface: imports Mathlib only.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# Verbatim copy of the Challenge definitions + the bridge to `RationalQuivers`.
[[lean_lib]]
name = "RQPalomar"

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
